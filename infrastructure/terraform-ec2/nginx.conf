worker_processes auto;

events {
  worker_connections 1024;
}

http {
  # Docker embedded DNS — re-resolve service names after container recreate
  resolver 127.0.0.11 valid=10s ipv6=off;

  map $arg_service $socket_upstream {
    default        root:3000;
    root           root:3000;
    trip           trip:3001;
    communication  communication:3002;
    booking        booking:3003;
    payment        payment:3004;
    admin          admin:3005;
  }

  server {
    listen 80;
    client_max_body_size 50m;

    location /health {
      default_type application/json;
      return 200 '{"status":"ok","service":"ec2-nginx"}';
    }

    # Socket.IO — clients pass ?service=<name> (same as gateway)
    location /socket.io/ {
      set $sock_upstream $socket_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://$sock_upstream;
    }

    location ~ ^/api/v1/(trip|review) {
      set $u trip:3001;
      proxy_pass http://$u;
      include /etc/nginx/proxy_params;
    }

    location ~ ^/api/v1/booking {
      set $u booking:3003;
      proxy_pass http://$u;
      include /etc/nginx/proxy_params;
    }

    location ~ ^/api/v1/(notification|message|chat|disclaimer|report) {
      set $u communication:3002;
      proxy_pass http://$u;
      include /etc/nginx/proxy_params;
    }

    location ~ ^/api/v1/(wallet|coupon|transaction|pricing-rules|webhook) {
      set $u payment:3004;
      proxy_pass http://$u;
      include /etc/nginx/proxy_params;
    }

    location ~ ^/api/v1/(admin|ticket|risk-settings|audit-logs) {
      set $u admin:3005;
      proxy_pass http://$u;
      include /etc/nginx/proxy_params;
    }

    location / {
      set $u root:3000;
      proxy_pass http://$u;
      include /etc/nginx/proxy_params;
    }
  }
}
