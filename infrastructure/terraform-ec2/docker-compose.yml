# Nest services + Redis + nginx. Database = DocumentDB (DB_URI in .env).
# Required: DOCKERHUB_USERNAME, IMAGE_TAG in .env.compose

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  root:
    image: ${DOCKERHUB_USERNAME}/sendit-root:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: [.env]
    environment:
      SERVICE_NAME: root
      PORT: "3000"
      IP_ADDRESS: "0.0.0.0"
    volumes:
      - ./certs:/app/certs:ro
    expose: ["3000"]
    depends_on:
      redis:
        condition: service_healthy

  trip:
    image: ${DOCKERHUB_USERNAME}/sendit-trip:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: [.env]
    environment:
      SERVICE_NAME: trip
      TRIP_SERVER_PORT: "3001"
      IP_ADDRESS: "0.0.0.0"
    volumes:
      - ./certs:/app/certs:ro
    expose: ["3001"]
    depends_on:
      redis:
        condition: service_healthy

  communication:
    image: ${DOCKERHUB_USERNAME}/sendit-communication:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: [.env]
    environment:
      SERVICE_NAME: communication
      COMMUNICATION_PORT: "3002"
      IP_ADDRESS: "0.0.0.0"
    volumes:
      - ./certs:/app/certs:ro
    expose: ["3002"]
    depends_on:
      redis:
        condition: service_healthy

  booking:
    image: ${DOCKERHUB_USERNAME}/sendit-booking:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: [.env]
    environment:
      SERVICE_NAME: booking
      BOOKING_PORT: "3003"
      IP_ADDRESS: "0.0.0.0"
    volumes:
      - ./certs:/app/certs:ro
    expose: ["3003"]
    depends_on:
      redis:
        condition: service_healthy

  payment:
    image: ${DOCKERHUB_USERNAME}/sendit-payment:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: [.env]
    environment:
      SERVICE_NAME: payment
      PAYMENT_PORT: "3004"
      IP_ADDRESS: "0.0.0.0"
    volumes:
      - ./certs:/app/certs:ro
    expose: ["3004"]
    depends_on:
      redis:
        condition: service_healthy

  admin:
    image: ${DOCKERHUB_USERNAME}/sendit-admin:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: [.env]
    environment:
      SERVICE_NAME: admin
      ADMIN_PORT: "3005"
      IP_ADDRESS: "0.0.0.0"
    volumes:
      - ./certs:/app/certs:ro
    expose: ["3005"]
    depends_on:
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "3010:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./proxy_params:/etc/nginx/proxy_params:ro
    depends_on:
      - root
      - trip
      - communication
      - booking
      - payment
      - admin

volumes:
  redis_data:
