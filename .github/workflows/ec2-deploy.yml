# EC2 all-in-one deploy — independent of ECS Fargate workflows.
# Does not modify root/trip/booking/communication/payment/admin/gateway.yml.
#
# Required GitHub Environment secrets (environment: ec2):
#   DOCKERHUB_TOKEN  — Docker Hub access token (same as ECS is fine)
#   EC2_HOST         — public IP or DNS (e.g. 3.124.97.90)
#   EC2_SSH_KEY      — private key PEM contents (sendit-ec2-dev-ec2.pem)
# Optional:
#   EC2_USER         — default ec2-user
#   DOCKERHUB_USERNAME — default shariful1234

name: 'CI/CD — EC2 all-in-one'

on:
  push:
    branches: [main, production, dev]
    paths:
      - 'apps/**'
      - 'utils/**'
      - 'package.json'
      - 'package-lock.json'
      - 'yarn.lock'
      - 'tsconfig.json'
      - 'nest-cli.json'
      - 'Dockerfile'
      - 'infrastructure/terraform-ec2/docker-compose.yml'
      - 'infrastructure/terraform-ec2/nginx.conf'
      - 'infrastructure/terraform-ec2/proxy_params'
      - '.github/workflows/ec2-deploy.yml'
  workflow_dispatch:

env:
  DOCKERHUB_USERNAME: shariful1234
  AWS_REGION: eu-central-1

jobs:
  build-push:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    environment: ec2
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: root
            port: '3000'
          - service: trip
            port: '3001'
          - service: communication
            port: '3002'
          - service: booking
            port: '3003'
          - service: payment
            port: '3004'
          - service: admin
            port: '3005'
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Hub token
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Set DOCKERHUB_TOKEN in Settings → Environments → ec2 → Environment secrets."
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/sendit-${{ matrix.service }}:latest
            ${{ env.DOCKERHUB_USERNAME }}/sendit-${{ matrix.service }}:sha-${{ github.sha }}
          build-args: |
            SERVICE_NAME=${{ matrix.service }}
            SERVICE_PORT=${{ matrix.port }}
          cache-from: type=gha,scope=ec2-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=ec2-${{ matrix.service }}

  deploy:
    name: Pull & restart on EC2
    runs-on: ubuntu-latest
    needs: build-push
    environment: ec2
    steps:
      - uses: actions/checkout@v4

      - name: Validate EC2 secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          if [ -z "$EC2_HOST" ] || [ -z "$EC2_SSH_KEY" ]; then
            echo "::error::Set EC2_HOST and EC2_SSH_KEY in Settings → Environments → ec2 → Environment secrets."
            exit 1
          fi

      - name: Sync compose + nginx to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ec2-user' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: 'infrastructure/terraform-ec2/docker-compose.yml,infrastructure/terraform-ec2/nginx.conf,infrastructure/terraform-ec2/proxy_params'
          target: '/opt/sendit'
          strip_components: 2

      - name: Pull images and restart stack
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ec2-user' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/sendit
            if [ ! -f .env ] || [ ! -f .env.compose ]; then
              echo "Missing /opt/sendit/.env or .env.compose — bootstrap the box once before CI deploy."
              exit 1
            fi
            # Ensure TLS CA for DocumentDB exists
            mkdir -p certs
            if [ ! -f certs/rds-global-bundle.pem ]; then
              curl -fsSL https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem -o certs/rds-global-bundle.pem
            fi
            if command -v sendit-up >/dev/null 2>&1; then
              sendit-up
            else
              docker compose --env-file .env.compose pull
              docker compose --env-file .env.compose up -d --remove-orphans
            fi
            docker image prune -f
            docker compose --env-file .env.compose ps
